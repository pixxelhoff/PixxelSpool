# Builds the Windows app (installer + portable zip) for every version tag (v*), or by hand under Actions.
# A tag creates a GitHub release with both files (a prerelease for -alpha / -beta / -rc tags); the Mac workflow
# (macos.yml) adds its disk image to the same release. Fixes only for the apps (Windows, Mac) get the
# version of the Pi plus "-patch.N" (1.0.0-patch.1); the Pi never offers those.
name: Windows app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r windows/requirements-windows.txt

      - name: Check the code imports
        env:
          PIXXELSPOOL_DATA: ${{ runner.temp }}\pxdata
        run: python -c "import filament_tool.main, filament_tool.winapp; print('ok')"

      - name: Build the app
        run: |
          python windows/make_ico.py
          pyinstaller --noconfirm --clean windows/pixxelspool.spec

      - name: Smoke test (start the server, ask for the overview)
        shell: pwsh
        env:
          PIXXELSPOOL_DATA: ${{ runner.temp }}\pxsmoke
        run: |
          $p = Start-Process -FilePath dist\PixxelSpool\PixxelSpool.exe -ArgumentList "--no-browser","--port","8123" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 2
            try { $r = Invoke-RestMethod http://localhost:8123/api/overview; if ($r.host.kind -eq "windows") { $ok = $true; break } } catch {}
          }
          Stop-Process -Id $p.Id -Force
          if (-not $ok) { Get-ChildItem -Recurse $env:PIXXELSPOOL_DATA | Out-Host; Get-Content "$env:PIXXELSPOOL_DATA\logs\pixxelspool.log" -ErrorAction SilentlyContinue | Out-Host; throw "app did not start" }
          Write-Host "smoke test ok"

      - name: Build the installer
        shell: pwsh
        run: |
          $v = (Get-Content VERSION).Trim()
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          $m = [regex]::Match($v, '^(\d+)\.(\d+)\.(\d+)(?:-patch\.?(\d+))?')
          $nv = "$($m.Groups[1].Value).$($m.Groups[2].Value).$($m.Groups[3].Value).$(if ($m.Groups[4].Success) { $m.Groups[4].Value } else { 0 })"
          & $iscc "/DAppVersion=$v" "/DNumVersion=$nv" windows\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "installer build failed" }
          Compress-Archive -Path dist\PixxelSpool -DestinationPath "windows\Output\PixxelSpool-$v-portable.zip"
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append

      # Only manual runs keep the files as a build artifact (for 2 days); a tag puts them into the release instead,
      # so nothing is stored twice in the Actions storage of the account.
      - uses: actions/upload-artifact@v7
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: PixxelSpool-${{ env.VERSION }}-windows
          path: windows/Output/*
          retention-days: 2
          compression-level: 0

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/ci/release.sh "${{ github.ref_name }}" "${{ env.VERSION }}" windows/Output/*
